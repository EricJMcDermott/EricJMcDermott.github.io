<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070f">
  <meta name="description" content="The work and worlds of Eric James McDermott.">
  <title>Eric James McDermott — Explorer, maker, scientist</title>
  <style>
    :root { color-scheme: dark; --ink: #f6f8ff; --muted: #aab4cc; --line: rgba(255,255,255,.18); }
    * { box-sizing: border-box; }
    html { background: #05070f; }
    body { min-width: 320px; margin: 0; overflow-x: hidden; background: radial-gradient(circle at 50% 22%, #122a60 0, #08112b 27%, transparent 52%), #05070f; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    a { color: inherit; }
    .skip { position: fixed; top: -4rem; left: 1rem; z-index: 20; padding: .7rem 1rem; background: white; color: #05070f; border-radius: 0 0 .5rem .5rem; }
    .skip:focus { top: 0; }
    .masthead { display: flex; justify-content: space-between; align-items: center; max-width: 1240px; margin: 0 auto; padding: 1.35rem 2rem; letter-spacing: .12em; text-transform: uppercase; font-size: .71rem; }
    .masthead__name { font-weight: 800; text-decoration: none; }
    .site-links { display: flex; align-items: center; gap: 1rem; }
    .masthead__tag { color: var(--muted); }
    .cv-link { padding-bottom: .2rem; border-bottom: 1px solid rgba(255,255,255,.5); color: var(--ink); font-weight: 800; text-decoration: none; }
    .cv-link:hover, .cv-link:focus-visible { border-color: #8db9ff; color: #8db9ff; }
    main { max-width: 1240px; margin: 0 auto; padding: clamp(.75rem, 2vw, 1.75rem) 2rem 2.25rem; }
    .worlds { position: relative; width: min(100%, 860px); aspect-ratio: 1495 / 1894; margin: clamp(1.25rem, 1vw, 2rem) auto 0; isolation: isolate; }
    .worlds::before { content: ""; position: absolute; inset: 2% -9%; z-index: -1; border-radius: 50%; background: radial-gradient(ellipse, rgba(35,89,255,.3), transparent 66%); filter: blur(28px); animation: pulse 7s ease-in-out infinite; }
    .worlds__image { display: block; width: 100%; height: 100%; object-fit: contain; filter: contrast(1.08) saturate(1.08); }
    .world { position: absolute; display: grid; place-items: center; width: 27%; aspect-ratio: 1; border: 1px solid transparent; border-radius: 50%; text-decoration: none; transition: transform .35s ease, border-color .35s ease, box-shadow .35s ease; outline-offset: 7px; }
    .world::after { content: "Explore ↗"; opacity: 0; position: absolute; bottom: 17%; padding: .32rem .5rem; border: 1px solid var(--line); border-radius: 999px; background: rgba(5,7,15,.72); backdrop-filter: blur(8px); color: white; font-size: clamp(.52rem, 1.1vw, .7rem); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; transition: opacity .25s ease, transform .25s ease; transform: translateY(5px); }
    .world:hover, .world:focus-visible { transform: scale(1.07); border-color: rgba(255,255,255,.9); box-shadow: 0 0 0 8px rgba(106,151,255,.18), 0 0 42px rgba(106,151,255,.45); }
    .world:hover::after, .world:focus-visible::after { opacity: 1; transform: translateY(0); }
    .business { left: 36.5%; top: 7.2%; }
    .science { left: 7.7%; top: 36.6%; }
    .adventure { right: 7.2%; top: 36.1%; }
    .art { left: 36.5%; bottom: 7.7%; }
    .footer { display: flex; justify-content: space-between; gap: 1rem; align-items: center; max-width: 1240px; margin: 0 auto; padding: 1.5rem 2rem 2.5rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; }
    .contact { padding: .75rem 1rem; border: 1px solid rgba(255,255,255,.55); border-radius: 999px; color: white; font-weight: 700; letter-spacing: .05em; text-decoration: none; text-transform: uppercase; transition: background .2s ease, color .2s ease; }
    .contact:hover, .contact:focus-visible { background: white; color: #05070f; }
    @keyframes pulse { 50% { transform: scale(1.08); opacity: .62; } }
    @media (max-width: 600px) { .masthead, main, .footer { padding-left: 1.15rem; padding-right: 1.15rem; } .masthead__tag { display: none; } .footer { flex-direction: column; align-items: flex-start; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <a class="skip" href="#worlds">Skip to worlds</a>
  <header class="masthead">
    <a class="masthead__name" href="/">Eric James McDermott</a>
    <nav class="site-links" aria-label="Site links"><span class="masthead__tag">Business · Science · Adventure · Art</span><a class="cv-link" href="science/EJM-CV.pdf" target="_blank" rel="noopener">CV ↗</a></nav>
  </header>
  <main>
    <nav class="worlds" id="worlds" aria-label="Explore Eric's work">
      <img class="worlds__image" src="websiteBackground.png" alt="Four intersecting worlds representing business, science, adventure, and art.">
      <a class="world business" href="business/" aria-label="Explore business"></a>
      <a class="world science" href="science/" aria-label="Explore science"></a>
      <a class="world adventure" href="adventure/" aria-label="Explore adventure"></a>
      <a class="world art" href="art/" aria-label="Explore art"></a>
    </nav>
  </main>
  <footer class="footer">
    <span>© Eric James McDermott</span>
    <a class="contact" href="mailto:EricJamesMcDermott@gmail.com">Start a conversation</a>
  </footer>
</body>
</html>
